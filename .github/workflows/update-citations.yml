name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 1" # Monday
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update citations
        id: update
        continue-on-error: true
        run: timeout 90 python bin/update_scholar_citations.py

      - name: Report Scholar failure
        if: steps.update.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar citation update failed; keeping the existing citation data."
          echo "⚠️ Google Scholar citation update failed; the existing citation data was kept." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and deploy if changed
        if: steps.update.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _data/citations.yml

          if git diff --cached --quiet; then
            echo "No citation changes."
            exit 0
          fi

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Update Google Scholar citations"
          git push

          gh workflow run deploy.yml \
            --ref main \
            --repo "$GITHUB_REPOSITORY"
